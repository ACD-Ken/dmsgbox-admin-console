<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMsgBox Admin — Pending Approvals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .topbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar h1 { font-size: 18px; color: #29b6f6; }
        .topbar nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }
        .topbar nav a:hover { color: #e2e8f0; }
        .topbar nav a.active { color: #29b6f6; }
        .content { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .page-subtitle { color: #64748b; margin-bottom: 28px; font-size: 14px; }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-header h2 { font-size: 15px; font-weight: 600; }
        .badge {
            background: #29b6f6;
            color: #000;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge.pending { background: #f59e0b; }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 12px 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            background: #0f172a;
        }
        td { padding: 14px 20px; border-top: 1px solid #1e293b; font-size: 14px; }
        tr:hover td { background: #0f172a33; }
        .email { font-weight: 500; }
        .date { color: #64748b; font-size: 13px; }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b44; }
        .status-approved { background: #22c55e22; color: #22c55e; border: 1px solid #22c55e44; }
        .btn {
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-approve { background: #22c55e; color: #000; }
        .btn-reject { background: #ef4444; color: #fff; margin-left: 8px; }
        .btn-refresh {
            background: #334155;
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }
        .empty { padding: 40px; text-align: center; color: #64748b; }
        #loginSection {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 40px;
            width: 360px;
        }
        .login-box h2 { margin-bottom: 24px; color: #29b6f6; }
        input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            padding: 10px 14px;
            font-size: 14px;
            margin-bottom: 14px;
        }
        .btn-login { width: 100%; background: #29b6f6; color: #000; padding: 11px; }
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: #1e293b; border: 1px solid #334155;
            border-radius: 10px; padding: 14px 20px;
            font-size: 14px; display: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .toast.show { display: block; }
        .toast.success { border-color: #22c55e44; color: #22c55e; }
        .toast.error { border-color: #ef444444; color: #ef4444; }
        #mainSection { display: none; }
    </style>
</head>
<body>

<!-- Login -->
<div id="loginSection">
    <div class="login-box">
        <h2>Admin Sign In</h2>
        <a class="btn btn-login" href="/site/DMB/admin-login.html?console=approvals">Sign In</a>
        <p id="loginError" style="color:#ef4444;margin-top:12px;font-size:13px;display:none;"></p>
    </div>
</div>

<!-- Main -->
<div id="mainSection">
    <div class="topbar">
        <h1>DMsgBox Admin</h1>
        <nav>
            <a href="index.html">Devices</a>
            <a href="pending-approvals.html" class="active">Approvals</a>
            <a href="#" onclick="signOut()">Sign Out</a>
        </nav>
    </div>

    <div class="content">
        <div class="page-title">User Approvals</div>
        <div class="page-subtitle">Approve or reject new user registrations before they can access the app.</div>

        <div class="card">
            <div class="card-header">
                <h2>Pending <span class="badge pending" id="pendingCount">0</span></h2>
                <button class="btn-refresh" onclick="loadUsers()">↻ Refresh</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Registered</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="pendingBody">
                    <tr><td colspan="4" class="empty">Loading…</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Approved <span class="badge" id="approvedCount">0</span></h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Approved At</th>
                        <th>Approved By</th>
                    </tr>
                </thead>
                <tbody id="approvedBody">
                    <tr><td colspan="3" class="empty">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js" integrity="sha384-OMZvx3Vy2g+m2/bV7wq4vKCSjS3P2+OVcOXSaqWaoK3ZoSAHaje1LSM9FK4MNk2J" crossorigin="anonymous"></script>
<script src="admin-session.js"></script>
<script>
    const { client, checkAdminSession, signInUrl } = window.dmsgboxAdmin;
    const byId = (id) => document.getElementById(id);

    sessionStorage.removeItem('adminToken');
    sessionStorage.removeItem('adminEmail');

    function addText(row, text, className = '') {
        const cell = row.insertCell();
        cell.className = className;
        cell.textContent = text;
        return cell;
    }

    function fillTable(body, rows, emptyMessage, columns, render) {
        body.replaceChildren();
        if (!rows.length) {
            addText(body.insertRow(), emptyMessage, 'empty').colSpan = columns;
            return;
        }
        for (const user of rows) render(body.insertRow(), user);
    }

    function addAction(cell, label, className, handler) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn ' + className;
        button.textContent = label;
        button.addEventListener('click', handler);
        cell.append(button);
    }

    async function loadUsers() {
        const { data, error } = await client.functions.invoke('admin/approvals', { method: 'GET' });
        if (error) {
            showToast('Failed to load users. Sign in again if your session expired.', 'error');
            return;
        }
        const pending = data.users.filter(user => !user.is_approved);
        const approved = data.users.filter(user => user.is_approved);

        byId('pendingCount').textContent = pending.length;
        byId('approvedCount').textContent = approved.length;
        fillTable(byId('pendingBody'), pending, 'No pending approvals', 4, (row, user) => {
            addText(row, user.email, 'email');
            addText(row, formatDate(user.created_at), 'date');
            addText(row, 'Pending');
            const actions = row.insertCell();
            addAction(actions, 'Approve', 'btn-approve', () => updateUser(user, true));
            addAction(actions, 'Reject', 'btn-reject', () => updateUser(user, false));
        });
        fillTable(byId('approvedBody'), approved, 'No approved users yet', 3, (row, user) => {
            addText(row, user.email, 'email');
            addText(row, formatDate(user.approved_at), 'date');
            addText(row, user.approved_by || '-', 'date');
        });
    }

    async function updateUser(user, approve) {
        if (!approve && !confirm('Delete account for ' + user.email + '? This cannot be undone.')) return;
        const path = 'admin/users/' + encodeURIComponent(user.id) + (approve ? '/approve' : '');
        const { error } = await client.functions.invoke(path, { method: approve ? 'POST' : 'DELETE' });
        if (error) {
            showToast(approve ? 'Failed to approve user' : 'Failed to reject user', 'error');
            return;
        }
        showToast(approve ? 'User approved' : 'User rejected and removed');
        await loadUsers();
    }

    async function signOut() {
        const { error } = await client.auth.signOut({ scope: 'local' });
        if (error) return showToast('Could not sign out. Try again.', 'error');
        location.reload();
    }

    function formatDate(iso) {
        return iso ? new Date(iso).toLocaleString() : '-';
    }

    function showToast(msg, type = 'success') {
        const t = byId('toast');
        t.textContent = msg;
        t.className = 'toast show ' + type;
        setTimeout(() => t.className = 'toast', 3000);
    }

    async function initializeApprovals() {
        try {
            const { state } = await checkAdminSession();
            if (state === 'mfa') return location.replace(signInUrl('approvals'));
            if (state === 'forbidden') throw new Error('Not an administrator');
            if (state !== 'ready') return;
            byId('loginSection').style.display = 'none';
            byId('mainSection').style.display = 'block';
            await loadUsers();
        } catch {
            byId('loginError').textContent = 'Could not verify administrator access.';
            byId('loginError').style.display = 'block';
        }
    }

    initializeApprovals();
</script>
</body>
</html>
